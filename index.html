<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oberstufen-Vokabeltrainer</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --error: #ef4444;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-light: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }
        header {
            text-align: center;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 1.2rem;
            margin: 0 0 2px 0;
            letter-spacing: -0.025em;
        }
        .subtitle {
            font-size: 0.8rem;
            color: var(--text-light);
        }
        .container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .meta-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-light);
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* 3D FLIP CARD CONTAINER */
        .card-scene {
            perspective: 1000px;
            width: 100%;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
        }
        .flashcard {
            width: 100%;
            flex-grow: 1;
            min-height: 280px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }
        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            box-sizing: border-box;
        }
        .card-back {
            transform: rotateY(180deg);
            background: #1e1b4b;
            border-color: #312e81;
        }

        .card-prompt {
            font-size: 0.8rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .card-question {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text);
            margin: auto 0;
        }
        .card-hint {
            font-size: 0.8rem;
            color: var(--text-light);
            text-align: center;
            margin-top: 12px;
        }

        /* OPTIONS LIST ON BACK */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: auto 0;
        }
        .option-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.9rem;
            text-align: left;
            color: var(--text);
            transition: all 0.2s;
        }
        .option-item.correct {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--success);
            color: #34d399;
            font-weight: 600;
        }
        .option-item.incorrect {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--error);
            color: #f87171;
        }

        /* CONTROLS & BUTTONS */
        .action-area {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-secondary {
            background: #334155;
            box-shadow: none;
        }
        .btn-success { background: var(--success); }
        .btn-error { background: var(--error); }

        .management-section {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .row {
            display: flex;
            gap: 6px;
        }
        .mgmt-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
        }
        .mgmt-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
        }
    </style>
</head>
<body>

    <header>
        <h1>Englisch-Gehirntraining</h1>
        <div class="subtitle">Smart Spaced Repetition • Modern Edition</div>
    </header>

    <div class="container">
        <div id="quiz-view">
            <div class="meta-info">
                <span id="progress-indicator">Karte 1 von 10</span>
                <span id="box-indicator">Level 1</span>
            </div>

            <div class="card-scene">
                <div class="flashcard" id="flashcard" onclick="flipCard()">
                    <!-- VORDERSEITE -->
                    <div class="card-face card-front">
                        <div>
                            <div class="card-prompt">Fragestellung</div>
                            <div class="card-question" id="front-question">Lade...</div>
                        </div>
                        <div class="card-hint">Antippen zum Umdrehen 👆</div>
                    </div>
                    <!-- RÜCKSEITE -->
                    <div class="card-face card-back">
                        <div>
                            <div class="card-prompt">Optionen & Lösung</div>
                            <div class="options-list" id="back-options"></div>
                        </div>
                        <div class="card-hint" id="feedback-hint">Bewertung wählen 👇</div>
                    </div>
                </div>
            </div>

            <div class="action-area" id="action-buttons" style="display: none;">
                <button class="btn btn-error" onclick="rateAnswer(false)">❌ Noch mal (Level 1)</button>
                <button class="btn btn-success" onclick="rateAnswer(true)">✔ Gewusst (Weiter)</button>
            </div>
        </div>

        <div id="finish-view" style="display: none; text-align: center; padding: 40px 20px; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border);">
            <h2>Runde durchgespielt! 🎯</h2>
            <p id="session-stats" style="margin: 15px 0; color: var(--text-light); font-size: 0.95rem;"></p>
            <button class="btn" onclick="startSession()">Neue Runde starten</button>
        </div>

        <div class="management-section">
            <button class="mgmt-btn" style="background: rgba(79, 70, 229, 0.15); color: #818cf8; border-color: rgba(79, 70, 229, 0.3);" onclick="document.getElementById('import-words-file').click()">📚 Wörterbuch aktualisieren (words.json)</button>
            <div class="row">
                <button class="mgmt-btn" onclick="exportProgress()">💾 Lernstand sichern</button>
                <button class="mgmt-btn" onclick="document.getElementById('import-prog-file').click()">📂 Lernstand laden</button>
            </div>
            <input type="file" id="import-words-file" style="display: none" onchange="importWordsJSON(event)">
            <input type="file" id="import-prog-file" style="display: none" onchange="importProgressJSON(event)">
        </div>
    </div>

    <script>
        let vocabulary = [
            { id: 1, q: "Was bedeutet das Wort „actually“ im Englischen?", options: ["aktuell, momentan", "tatsächlich, eigentlich", "amtlich, offiziell"], correct: 1 },
            { id: 2, q: "Was bedeutet das Wort „sensible“?", options: ["sensibel, empfindsam", "vernünftig, sinnvoll", "spürbar, fühlbar"], correct: 1 },
            { id: 3, q: "Wie übersetzt man das Verb „to imply“ am präzisesten?", options: ["annehmen, vermuten", "andeuten, implizieren", "widerspiegeln"], correct: 1 },
            { id: 4, q: "Wie drückt man aus: „Eigentlich hatte ich etwas anderes im Sinn“?", options: ["Actually, I had something else in mind.", "Actually, I had planned this otherwise.", "Currently, I had another idea."], correct: 0 },
            { id: 5, q: "Welcher Satz ist grammatikalisch korrekt (Stichwort: ‚discuss‘)?", options: ["We need to discuss about this issue.", "We need to discuss this issue.", "We need to discuss about this."], correct: 1 },
            { id: 6, q: "Wie heißt es korrekt nach „to look forward to“?", options: ["I am looking forward to see you.", "I am looking forward to seeing you.", "I am looking forward see you."], correct: 1 },
            { id: 7, q: "Wie unterscheidet sich „economic“ von „economical“?", options: ["Economic = wirtschaftlich/sparsam; Economical = auf die Wirtschaft bezogen", "Economic = auf die Volkswirtschaft bezogen; Economical = sparsam / wirtschaftlich im Verbrauch", "Es gibt keinen Unterschied."], correct: 1 },
            { id: 8, q: "Was bedeutet das englische Wort „currently“?", options: ["aktuell / derzeit", "eigentlich", "konsequent"], correct: 0 }
        ];

        let userProgress = {}; 
        let activeQueue = [];
        let currentIndex = 0;
        let sessionCorrect = 0;
        let currentCard = null;
        let isFlipped = false;
        let answeredCurrent = false;

        function initApp() {
            const savedVocab = localStorage.getItem('vocab_data_v4');
            if (savedVocab) { try { vocabulary = JSON.parse(savedVocab); } catch(e) {} }

            const savedProg = localStorage.getItem('vocab_progress_v4');
            if (savedProg) { try { userProgress = JSON.parse(savedProg); } catch(e) {} }

            vocabulary.forEach(item => {
                item.level = userProgress[item.id] !== undefined ? userProgress[item.id] : 1;
            });

            startSession();
        }

        function startSession() {
            sessionCorrect = 0;
            activeQueue = [];
            vocabulary.forEach(item => {
                let weight = 4 - item.level;
                if (weight < 1) weight = 1;
                for (let i = 0; i < weight; i++) {
                    activeQueue.push({...item});
                }
            });
            activeQueue.sort(() => Math.random() - 0.5);
            if (activeQueue.length > 10) activeQueue = activeQueue.slice(0, 10);

            currentIndex = 0;
            document.getElementById('quiz-view').style.display = 'flex';
            document.getElementById('finish-view').style.display = 'none';
            loadCard();
        }

        function loadCard() {
            isFlipped = false;
            answeredCurrent = false;
            document.getElementById('flashcard').classList.remove('is-flipped');
            document.getElementById('action-buttons').style.display = 'none';

            if (currentIndex >= activeQueue.length) {
                showFinish();
                return;
            }

            currentCard = activeQueue[currentIndex];
            document.getElementById('progress-indicator').innerText = `Karte ${currentIndex + 1} von ${activeQueue.length}`;
            document.getElementById('box-indicator').innerText = `Level ${currentCard.level} / 3`;
            document.getElementById('front-question').innerText = currentCard.q;

            const backOptions = document.getElementById('back-options');
            backOptions.innerHTML = '';

            currentCard.options.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = 'option-item';
                div.innerText = opt;
                // Klick auf eine Option auf der Rückseite wertet direkt aus
                div.onclick = (e) => {
                    e.stopPropagation(); // Verhindert Doppelt-Flip
                    evaluateSelection(index);
                };
                backOptions.appendChild(div);
            });
        }

        function flipCard() {
            if (answeredCurrent) return;
            const card = document.getElementById('flashcard');
            isFlipped = !isFlipped;
            if (isFlipped) {
                card.classList.add('is-flipped');
            } else {
                card.classList.remove('is-flipped');
            }
        }

        function evaluateSelection(selectedIndex) {
            if (answeredCurrent) return;
            answeredCurrent = true;

            // Karte sicher umdrehen, falls sie noch vorn war
            if (!isFlipped) {
                isFlipped = true;
                document.getElementById('flashcard').classList.add('is-flipped');
            }

            const options = document.getElementById('back-options').children;
            let vocabItem = vocabulary.find(v => v.id === currentCard.id);

            if (selectedIndex === currentCard.correct) {
                options[selectedIndex].classList.add('correct');
                document.getElementById('feedback-hint').innerText = 'Richtig verankert! ✨';
                sessionCorrect++;
                if (vocabItem.level < 3) vocabItem.level++;
            } else {
                options[selectedIndex].classList.add('incorrect');
                options[currentCard.correct].classList.add('correct');
                document.getElementById('feedback-hint').innerText = 'Nicht ganz – wandert in die Wiederholung.';
                vocabItem.level = 1;
            }

            userProgress[vocabItem.id] = vocabItem.level;
            localStorage.setItem('vocab_progress_v4', JSON.stringify(userProgress));

            // Zeige Aktion-Buttons (Weiter / Nochmal)
            document.getElementById('action-buttons').style.display = 'flex';
        }

        function rateAnswer(wasCorrect) {
            // Falls über die großen Buttons unten gesteuert
            let vocabItem = vocabulary.find(v => v.id === currentCard.id);
            if (wasCorrect) {
                if (vocabItem.level < 3) vocabItem.level++;
                sessionCorrect++;
            } else {
                vocabItem.level = 1;
            }
            userProgress[vocabItem.id] = vocabItem.level;
            localStorage.setItem('vocab_progress_v4', JSON.stringify(userProgress));

            currentIndex++;
            loadCard();
        }

        function showFinish() {
            document.getElementById('quiz-view').style.display = 'none';
            document.getElementById('finish-view').style.display = 'block';
            document.getElementById('session-stats').innerText = `Du hast ${sessionCorrect} von ${activeQueue.length} Karten erfolgreich gemeistert!`;
        }

        function exportProgress() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(userProgress));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "lernstand_backup_" + new Date().toISOString().slice(0,10) + ".json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importProgressJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    userProgress = JSON.parse(e.target.result);
                    localStorage.setItem('vocab_progress_v4', JSON.stringify(userProgress));
                    vocabulary.forEach(item => {
                        if (userProgress[item.id] !== undefined) item.level = userProgress[item.id];
                    });
                    alert("Lernstand erfolgreich geladen!");
                    startSession();
                } catch(err) { alert("Fehler beim Einlesen."); }
            };
            reader.readAsText(file);
        }

        function importWordsJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const newVocab = JSON.parse(e.target.result);
                    if (Array.isArray(newVocab)) {
                        vocabulary = newVocab;
                        localStorage.setItem('vocab_data_v4', JSON.stringify(vocabulary));
                        vocabulary.forEach(item => {
                            item.level = userProgress[item.id] !== undefined ? userProgress[item.id] : 1;
                        });
                        alert(`Wörterbuch aktualisiert! (${vocabulary.length} Vokabeln)`);
                        startSession();
                    }
                } catch(err) { alert("Fehler beim Laden der words.json."); }
            };
            reader.readAsText(file);
        }

        initApp();
    </script>
</body>
</html>
